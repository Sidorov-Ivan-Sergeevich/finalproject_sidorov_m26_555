[project]
name = "finalproject_sidorov_m26_555"
version = "0.1.0"
description = "Console platform for virtual currency trading and rate tracking"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Ivan Sidorov" },
]
dependencies = [
    "prettytable>=3.18.0",
    "requests>=2.34.2",
]

[project.scripts]
valutatrade = "valutatrade_hub.cli.interface:main"
valutatrade-parser = "valutatrade_hub.parser_service.scheduler:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["valutatrade_hub"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.valutatrade]
data_dir = "data"
logs_dir = "logs"
rates_ttl_seconds = 300
default_base_currency = "USD"
log_level = "INFO"
log_format = "json"
log_max_bytes = 1048576
log_backup_count = 3

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
